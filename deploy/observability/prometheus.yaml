global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: agent-continuity
    metrics_path: /metrics
    static_configs:
      - targets: ["server:8080"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
