name: agent-continuity
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: continuity
      POSTGRES_USER: continuity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U continuity -d continuity"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 0.50
    restart: unless-stopped
    networks: [continuity]

  minio:
    image: agent-continuity-minio:source-7aac2a2c5b7c
    build: {context: ../.., dockerfile: deploy/images/objectstore/Dockerfile, target: minio}
    pull_policy: build
    command: ["server", "--console-address", ":9001", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - object-data:/data
    mem_limit: 256m
    cpus: 0.35
    restart: unless-stopped
    networks: [continuity]

  tempo:
    image: grafana/tempo:3.0.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${CONTINUITY_TEMPO_PORT:-13200}:3200"
    mem_limit: 256m
    cpus: 0.25
    restart: unless-stopped
    networks: [continuity]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on: [tempo]
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${CONTINUITY_OTEL_METRICS_PORT:-18888}:8888"
    mem_limit: 128m
    cpus: 0.20
    restart: unless-stopped
    networks: [continuity]

  prometheus:
    image: prom/prometheus:v3.13.0
    command: ["--config.file=/etc/prometheus/prometheus.yaml", "--storage.tsdb.retention.time=24h"]
    volumes:
      - ../observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ../observability/alerts.yaml:/etc/prometheus/rules/agent-continuity.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "${CONTINUITY_PROMETHEUS_PORT:-19090}:9090"
    mem_limit: 256m
    cpus: 0.25
    restart: unless-stopped
    networks: [continuity]

  grafana:
    image: grafana/grafana:13.1.0
    depends_on: [prometheus, tempo]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-continuity-local-only}
    volumes:
      - ../observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${CONTINUITY_GRAFANA_PORT:-13000}:3000"
    mem_limit: 192m
    cpus: 0.20
    restart: unless-stopped
    networks: [continuity]

  server:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${CONTINUITY_IMAGE:-agent-continuity:dev}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      CONTINUITY_LISTEN_ADDRESS: :8080
      CONTINUITY_STORE: postgres
      CONTINUITY_DATABASE_URL: postgresql://continuity:${POSTGRES_PASSWORD}@postgres:5432/continuity?sslmode=disable
      CONTINUITY_JWT_SECRET: ${CONTINUITY_JWT_SECRET:?CONTINUITY_JWT_SECRET is required}
      CONTINUITY_BOOTSTRAP_TOKEN: ${CONTINUITY_BOOTSTRAP_TOKEN:?CONTINUITY_BOOTSTRAP_TOKEN is required}
      CONTINUITY_MASTER_KEY: ${CONTINUITY_MASTER_KEY:?CONTINUITY_MASTER_KEY is required}
      CONTINUITY_ARTIFACT_DIR: /data/artifacts
      CONTINUITY_ARTIFACT_BACKEND: s3
      CONTINUITY_S3_ENDPOINT: http://minio:9000
      CONTINUITY_S3_BUCKET: continuity-artifacts
      CONTINUITY_S3_REGION: us-east-1
      CONTINUITY_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      CONTINUITY_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      CONTINUITY_S3_AUTO_CREATE: "true"
      CONTINUITY_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      CONTINUITY_AUTO_MIGRATE: "true"
      CONTINUITY_MAX_BODY_BYTES: "33554432"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/v1/health/ready"]
      interval: 3s
      timeout: 2s
      retries: 30
    ports:
      - "${CONTINUITY_PORT:-18080}:8080"
    volumes:
      - artifact-data:/data
    mem_limit: 256m
    cpus: 0.50
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks: [continuity]

volumes:
  postgres-data:
  artifact-data:
  object-data:
  tempo-data:
  prometheus-data:
  grafana-data:
networks:
  continuity:
