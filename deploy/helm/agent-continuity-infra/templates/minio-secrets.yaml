{{- if and .Values.minio.enabled .Values.minioBootstrap.manageSecrets }}
{{- $name := .Values.minio.fullnameOverride -}}
{{- $tls := lookup "v1" "Secret" .Release.Namespace .Values.minio.tls.certSecret -}}
{{- $tlsData := $tls.data | default dict -}}
{{- if not $tls }}
{{- $ca := genCA (printf "%s-local-ca" $name) 3650 -}}
{{- $cert := genSignedCert $name (list "127.0.0.1") (list $name "localhost" (printf "%s.%s" $name .Release.Namespace) (printf "%s.%s.svc" $name .Release.Namespace) (printf "%s.%s.svc.cluster.local" $name .Release.Namespace)) 365 $ca -}}
{{- $tlsData = dict "ca.crt" ($ca.Cert | b64enc) "public.crt" (printf "%s%s" $cert.Cert $ca.Cert | b64enc) "private.key" ($cert.Key | b64enc) -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.minio.tls.certSecret }}
  annotations: {helm.sh/resource-policy: keep}
type: Opaque
data: {{- toYaml $tlsData | nindent 2 }}
---
{{- $root := lookup "v1" "Secret" .Release.Namespace .Values.minio.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.minio.existingSecret }}
  annotations: {helm.sh/resource-policy: keep}
type: Opaque
data:
  {{- if $root }}
  rootUser: {{ required "existing MinIO root secret lacks rootUser" $root.data.rootUser | quote }}
  rootPassword: {{ required "existing MinIO root secret lacks rootPassword" $root.data.rootPassword | quote }}
  {{- else }}
  rootUser: {{ printf "root-%s" (randAlphaNum 16) | b64enc | quote }}
  rootPassword: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
---
{{- $client := lookup "v1" "Secret" .Release.Namespace .Values.minioBootstrap.clientSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.minioBootstrap.clientSecret }}
  annotations: {helm.sh/resource-policy: keep}
type: Opaque
data:
  ca.crt: {{ required "MinIO TLS secret must include ca.crt" (index $tlsData "ca.crt") | quote }}
  {{- if $client }}
  access-key: {{ required "existing MinIO client secret lacks access-key" (index $client.data "access-key") | quote }}
  secret-key: {{ required "existing MinIO client secret lacks secret-key" (index $client.data "secret-key") | quote }}
  {{- else }}
  access-key: {{ printf "archive-%s" (randAlphaNum 12) | b64enc | quote }}
  secret-key: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
{{- end }}
