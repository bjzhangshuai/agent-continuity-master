{{- if .Values.minio.enabled }}
{{- if or (not .Values.minio.tls.enabled) (not .Values.minio.existingSecret) }}
{{- fail "MinIO requires TLS and an existing/generated root Secret" }}
{{- end }}
{{- if or (not (regexMatch "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$" .Values.minioBootstrap.bucket)) (not (regexMatch "^[a-zA-Z0-9_-]+$" .Values.minioBootstrap.prefix)) }}
{{- fail "MinIO bootstrap requires a safe dedicated bucket and single-segment prefix" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-minio-policy
data:
  policy.json: |
    {"Version":"2012-10-17","Statement":[
      {"Effect":"Allow","Action":["s3:GetBucketLocation"],"Resource":["arn:aws:s3:::{{ .Values.minioBootstrap.bucket }}"]},
      {"Effect":"Allow","Action":["s3:PutObject","s3:GetObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::{{ .Values.minioBootstrap.bucket }}/{{ .Values.minioBootstrap.prefix }}/*"]}
    ]}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-minio-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: minio-bootstrap}
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: bootstrap
          image: {{ .Values.minioBootstrap.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{- toYaml .Values.minioBootstrap.resources | nindent 12 }}
          env:
            - {name: MC_CONFIG_DIR, value: /tmp/mc}
            - {name: GOMAXPROCS, value: "2"}
            - {name: GOMEMLIMIT, value: 96MiB}
          command: [/bin/sh, -ec]
          args:
            - |
              # No tracing: credentials are read from Secret files, never logged.
              mkdir -p /tmp/mc/certs/CAs
              cp /ca/ca.crt /tmp/mc/certs/CAs/ca.crt
              mc alias set local https://{{ .Values.minio.fullnameOverride }}:9000 "$(cat /root-auth/rootUser)" "$(cat /root-auth/rootPassword)" --api S3v4 >/dev/null
              mc ready local >/dev/null
              mc mb --ignore-existing local/{{ .Values.minioBootstrap.bucket }} >/dev/null
              mc anonymous set none local/{{ .Values.minioBootstrap.bucket }} >/dev/null
              mc quota set local/{{ .Values.minioBootstrap.bucket }} --size {{ .Values.minioBootstrap.quota | quote }} >/dev/null
              mc admin policy create local continuity-archive /policy/policy.json >/dev/null
              mc admin user add local "$(cat /client-auth/access-key)" "$(cat /client-auth/secret-key)" >/dev/null
              mc admin policy attach local continuity-archive --user "$(cat /client-auth/access-key)" >/dev/null
              echo 'MinIO: private bucket, quota and restricted archive identity ready (TLS verified).'
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: root-auth, mountPath: /root-auth, readOnly: true}
            - {name: client-auth, mountPath: /client-auth, readOnly: true}
            - {name: ca, mountPath: /ca, readOnly: true}
            - {name: policy, mountPath: /policy, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
        - name: root-auth
          secret: {secretName: {{ .Values.minio.existingSecret }}, defaultMode: 0440}
        - name: client-auth
          secret: {secretName: {{ .Values.minioBootstrap.clientSecret }}, defaultMode: 0440}
        - name: ca
          secret:
            secretName: {{ .Values.minioBootstrap.clientSecret }}
            items: [{key: ca.crt, path: ca.crt}]
        - name: policy
          configMap: {name: {{ .Release.Name }}-minio-policy}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-minio
spec:
  podSelector: {matchLabels: {app: minio, release: {{ .Release.Name }}}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/part-of: agent-continuity}}
          {{- with .Values.clientNamespaceLabels }}
          namespaceSelector: {matchLabels: {{ toJson . }}}
          {{- end }}
        - podSelector: {matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: minio-bootstrap}}
      ports: [{protocol: TCP, port: 9000}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-minio-bootstrap
spec:
  podSelector: {matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: minio-bootstrap}}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector: {matchLabels: {app: minio, release: {{ .Release.Name }}}}
      ports: [{protocol: TCP, port: 9000}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
{{- end }}
