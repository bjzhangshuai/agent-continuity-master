{{- if .Values.nats.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-nats
spec:
  minAvailable: 2
  selector:
    matchLabels: {app.kubernetes.io/name: nats, app.kubernetes.io/instance: {{ .Release.Name }}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-nats
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: nats, app.kubernetes.io/instance: {{ .Release.Name }}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: archive-worker, app.kubernetes.io/part-of: agent-continuity}
          {{- with .Values.clientNamespaceLabels }}
          namespaceSelector:
            matchLabels: {{- toYaml . | nindent 14 }}
          {{- end }}
      ports: [{protocol: TCP, port: 4222}]
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: nats, app.kubernetes.io/instance: {{ .Release.Name }}}
      ports: [{protocol: TCP, port: 6222}]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: nats, app.kubernetes.io/instance: {{ .Release.Name }}}
      ports: [{protocol: TCP, port: 6222}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
{{- end }}
