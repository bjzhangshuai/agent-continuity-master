apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agent-continuity.fullname" . }}
  labels:
    {{- include "agent-continuity.labels" . | nindent 4 }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agent-continuity.fullname" . }}
  labels:
    {{- include "agent-continuity.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "agent-continuity.serviceAccountName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agent-continuity.fullname" . }}
