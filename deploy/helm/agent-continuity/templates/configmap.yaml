apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-continuity.fullname" . }}-config
  labels:
    {{- include "agent-continuity.labels" . | nindent 4 }}
data:
  {{- if not .Values.archive.existingSecret }}
  CONTINUITY_ARCHIVE_CONFIG: {{ mergeOverwrite (deepCopy .Values.archive.config) (dict "enabled" .Values.archive.enabled) | toJson | quote }}
  {{- end }}
  CONTINUITY_PLATFORM_SUPER_ADMINS: {{ .Values.platform.superAdminAccountIDs | quote }}
  {{- if not .Values.treasury.existingSecret }}
  CONTINUITY_TREASURY_CONFIG: {{ dict "owner_account_id" .Values.treasury.ownerAccountID "demo_enabled" .Values.treasury.demoEnabled "allow_live" false | toJson | quote }}
  {{- end }}
  {{- if not .Values.payments.existingSecret }}
  CONTINUITY_PAYMENT_CONFIG: {{ dict "demo_enabled" .Values.payments.demoEnabled "public_base_url" .Values.payments.publicBaseURL "allow_live" false | toJson | quote }}
  {{- end }}
  CONTINUITY_LISTEN_ADDRESS: ":8080"
  CONTINUITY_STORE: "postgres"
  CONTINUITY_SERVICE_NAME: "agent-continuity"
  CONTINUITY_DATA_RESIDENCY: {{ .Values.config.dataResidency | quote }}
  CONTINUITY_ARTIFACT_DIR: "/data/artifacts"
  CONTINUITY_ARTIFACT_BACKEND: {{ .Values.artifactStorage.backend | quote }}
  CONTINUITY_S3_ENDPOINT: {{ .Values.artifactStorage.s3.endpoint | quote }}
  CONTINUITY_S3_BUCKET: {{ .Values.artifactStorage.s3.bucket | quote }}
  CONTINUITY_S3_REGION: {{ .Values.artifactStorage.s3.region | quote }}
  CONTINUITY_S3_AUTO_CREATE: {{ .Values.artifactStorage.s3.autoCreate | quote }}
  CONTINUITY_OTLP_TRACES_ENDPOINT: {{ .Values.observability.otlpTracesEndpoint | quote }}
  CONTINUITY_OIDC_ISSUER: {{ .Values.enterpriseIdentity.oidc.issuer | quote }}
  CONTINUITY_OIDC_AUDIENCE: {{ .Values.enterpriseIdentity.oidc.audience | quote }}
  CONTINUITY_OIDC_ORGANIZATION_ID: {{ .Values.enterpriseIdentity.oidc.organizationID | quote }}
  CONTINUITY_OIDC_AUTO_PROVISION: {{ .Values.enterpriseIdentity.oidc.autoProvision | quote }}
  CONTINUITY_SCIM_ORGANIZATION_ID: {{ .Values.enterpriseIdentity.scim.organizationID | quote }}
  CONTINUITY_AUTO_MIGRATE: {{ .Values.config.autoMigrate | quote }}
  CONTINUITY_MAX_BODY_BYTES: {{ .Values.config.maxBodyBytes | quote }}
  CONTINUITY_SHUTDOWN_GRACE: {{ .Values.config.shutdownGrace | quote }}
