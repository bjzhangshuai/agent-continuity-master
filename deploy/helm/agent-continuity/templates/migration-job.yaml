apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agent-continuity.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "agent-continuity.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "5"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "agent-continuity.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: agent-continuity
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - 'attempt=0; until /app/server migrate; do attempt=$((attempt+1)); [ "$attempt" -ge 30 ] && exit 1; sleep 2; done'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          env:
            - {name: CONTINUITY_STORE, value: postgres}
            - name: CONTINUITY_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: database-url}}
            - name: CONTINUITY_JWT_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: jwt-secret}}
            - name: CONTINUITY_BOOTSTRAP_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: bootstrap-token}}
            - name: CONTINUITY_MASTER_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: master-key}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
