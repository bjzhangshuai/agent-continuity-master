name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/metadata-action@v5
        id: meta
        with: {images: 'ghcr.io/${{ github.repository }}'}
      - uses: docker/build-push-action@v6
        id: build
        with: {context: ., push: true, tags: '${{ steps.meta.outputs.tags }}', labels: '${{ steps.meta.outputs.labels }}', platforms: linux/amd64, provenance: true, sbom: true}
      - uses: sigstore/cosign-installer@v3
      - name: Keyless image signature
        env: {DIGEST: '${{ steps.build.outputs.digest }}', IMAGE: 'ghcr.io/${{ github.repository }}'}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: azure/setup-helm@v4
      - name: Package Helm chart
        run: helm package deploy/helm/agent-continuity --destination dist
      - uses: actions/upload-artifact@v4
        with: {name: helm-chart, path: dist/*.tgz}
