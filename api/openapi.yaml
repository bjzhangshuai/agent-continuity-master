    post:
      operationId: simulatePayment
      parameters: [{$ref: '#/components/parameters/InvoiceID'}, {$ref: '#/components/parameters/PaymentID'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [outcome], properties: {outcome: {enum: [succeeded, failed, canceled]}}}}}}
      responses: {'200': {description: Simulation only; no money moves}, '400': {$ref: '#/components/responses/Error'}}
  /v1/billing/invoices/{invoiceID}/receipts/{receiptID}:
    get:
      operationId: getPaymentReceipt
      parameters: [{$ref: '#/components/parameters/InvoiceID'}, {name: receiptID, in: path, required: true, schema: {type: string}}, {name: format, in: query, schema: {enum: [json, html], default: json}}]
      responses: {'200': {description: Payment receipt; not a tax invoice or bank settlement statement}, '404': {$ref: '#/components/responses/Error'}}
  /v1/payments/webhooks/{provider}:
    post:
      operationId: receiveVerifiedPaymentNotification
      security: []
      parameters: [{name: provider, in: path, required: true, schema: {enum: [wechat, alipay, paypal, stripe]}}]
      description: Provider-specific signature required on raw body; bounded at 256 KiB. Unverified input never marks an invoice paid.
      responses: {'204': {description: Verified notification accepted or unsupported verified event ignored}, '200': {description: Alipay success text acknowledgement}, '400': {$ref: '#/components/responses/Error'}}
  /v1/billing/invoices/{invoiceID}/refunds:
    post:
      operationId: requestRefund
      description: Tenant owner/billing requests original-route refund. Invoice CAS reserves amount including pending requests; historical receipt and invoice amount remain immutable.
      parameters: [{$ref: '#/components/parameters/InvoiceID'}, {$ref: '#/components/parameters/BillingIdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [payment_id,amount_minor,reason], properties: {payment_id: {type: string}, amount_minor: {type: integer, minimum: 1}, reason: {type: string, maxLength: 240}}}}}}
      responses: {'200': {description: Requested refund or identical idempotent result}, '400': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /v1/billing/invoices/{invoiceID}/refunds/{refundID}/reconcile:
    post:
      operationId: reconcileRefund
      parameters: [{$ref: '#/components/parameters/InvoiceID'}, {name: refundID, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Verified refund result or unchanged terminal record}, '502': {$ref: '#/components/responses/Error'}}
  /v1/billing/invoices/{invoiceID}/statement:
    get:
      operationId: downloadBillingStatement
      parameters: [{$ref: '#/components/parameters/InvoiceID'}]
      responses: {'200': {description: Printable consumption, original payment receipt and refund credit notes; not a tax invoice, content: {text/html: {schema: {type: string}}}}, '404': {$ref: '#/components/responses/Error'}}
  /v1/treasury/receivables/{invoiceID}/statement:
    get:
      operationId: downloadMerchantStatement
      parameters: [{$ref: '#/components/parameters/InvoiceID'}]
      responses: {'200': {description: Configured merchant evidence only; no payer checkout authority}}
  /v1/treasury/receivables/{invoiceID}/refunds/{refundID}/{action}:
    post:
      operationId: operateRefund
      description: Configured merchant only. decision requires treasury:approve; other actions treasury:write. Live approval requires a different account from the requester. simulate is demo-only. No request accepts an alternate refund destination.
      parameters: [{$ref: '#/components/parameters/InvoiceID'}, {name: refundID, in: path, required: true, schema: {type: string}}, {name: action, in: path, required: true, schema: {enum: [decision,submit,reconcile,simulate]}}]
      requestBody: {content: {application/json: {schema: {type: object, properties: {decision: {enum: [approved,rejected]}, reason: {type: string}, outcome: {enum: [succeeded,failed]}}}}}}
      responses: {'200': {description: Updated refund and credit note evidence}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '502': {$ref: '#/components/responses/Error'}}
  /v1/marketplace/listings:
    get: {security: [], responses: {'200': {description: Published marketplace listings}}}
    post: {responses: {'201': {description: Marketplace listing created}}}
  /v1/marketplace/listings/{listingID}/install:
    post:
      parameters: [{name: listingID, in: path, required: true, schema: {type: string}}]
