    post: {description: Connect JSON unary GetTask procedure, responses: {'200': {description: Connect response}}}
  /agentcontinuity.v1.ContinuityService/ListTasks:
    post: {description: Connect JSON unary ListTasks procedure, responses: {'200': {description: Connect response}}}
