openapi: 3.1.0
info:
  title: Agent Continuity API
  version: 0.1.0
  description: Versioned control, sync, collaboration, developer-platform, MCP, A2A, and Connect API.
servers: [{url: 'http://127.0.0.1:8080'}]
security: [{bearerAuth: []}, {portalSession: []}]
paths:
  /v1/storage/config:
    get:
      summary: Non-sensitive archive configuration (no cloud credentials)
      responses: {'200': {description: Enabled flag, provider IDs and worker limits}, '401': {$ref: '#/components/responses/Error'}}
  /v1/tasks/{taskID}/contents:
    post:
      parameters: [{$ref: '#/components/parameters/TaskID'}]
      description: Upload at most 8 MiB decoded content. Requires task write access. Persist and reuse artifact_id/version_id for retries. Acceptance is not cloud completion; poll storage-jobs. Larger files use resumable artifact uploads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artifact_id, version_id, filename, content_type, content_base64]
              properties:
                artifact_id: {type: string}
                version_id: {type: string}
                parent_version_id: {type: string}
                filename: {type: string}
                content_type: {type: string}
                content_base64: {type: string, contentEncoding: base64, maxLength: 11184812}
      responses: {'201': {description: Artifact accepted and durable Outbox committed if archival enabled}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '413': {$ref: '#/components/responses/Error'}, '503': {description: Outbox full, retry later}, '507': {description: Durable staging full}}
  /v1/tasks/{taskID}/storage-jobs:
    get:
      parameters: [{$ref: '#/components/parameters/TaskID'}, {name: after, in: query, schema: {type: integer, format: int64, minimum: 0}}]
      description: Authorized task/attachment jobs, paginated at 100. Follow next_after while has_more.
      responses: {'200': {description: 'jobs, next_after, has_more; states queued/processing/retry/stored/dead/deleted; operation archive/delete; stored_at/deleted_at/retain_until/legal_hold'}, '403': {$ref: '#/components/responses/Error'}}
  /v1/tasks/{taskID}/storage-jobs/{jobID}:
    get:
      parameters: [{$ref: '#/components/parameters/TaskID'}, {name: jobID, in: path, required: true, schema: {type: integer, format: int64}}]
      responses: {'200': {description: Archive job and redacted error code}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /v1/tasks/{taskID}/storage-jobs/{jobID}/content:
    get:
      parameters: [{$ref: '#/components/parameters/TaskID'}, {name: jobID, in: path, required: true, schema: {type: integer, format: int64}}]
      description: Proxy private cloud content only after stored; bounded size and verified SHA-256. Same task and artifact permissions as original content.
      responses: {'200': {description: Binary content}, '409': {description: Not stored yet}, '503': {description: Cloud read unavailable or integrity failure}}
  /v1/tasks/{taskID}/storage-jobs/{jobID}/retry:
    post:
      parameters: [{$ref: '#/components/parameters/TaskID'}, {name: jobID, in: path, required: true, schema: {type: integer, format: int64}}]
      description: Task admin and artifact permission required. Replay only dead-letter jobs.
      responses: {'202': {description: Queued for replay}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /v1/tasks/{taskID}/storage-backfill:
    post:
      parameters: [{$ref: '#/components/parameters/TaskID'}]
      description: Task administrator explicitly archives at most 100 historical events/artifacts. No automatic historical export.
      responses: {'202': {description: enqueued and batch_limit}, '403': {$ref: '#/components/responses/Error'}, '503': {description: Outbox full}}
  /v1/tasks/{taskID}/storage-jobs/{jobID}/delete:
    post:
      parameters: [{$ref: '#/components/parameters/TaskID'}, {name: jobID, in: path, required: true, schema: {type: integer, format: int64}}]
      description: 'Task/attachment admin requests deletion of this CURRENT archive object only. Requires lifecycle.allow_delete, matching hash, expired retention, no legal hold, and local durability not relinquished to cache eviction. Never erases source conversations or noncurrent bucket versions. Request and completion are audited; same-hash repeats are idempotent.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [confirm_hash, reason], properties: {confirm_hash: {type: string}, reason: {type: string, minLength: 8, maxLength: 500}}}
      responses: {'202': {description: Durable deletion queued}, '403': {$ref: '#/components/responses/Error'}, '409': {description: Protected by retention/hold/cache durability or mismatched hash}}
  /v1/tasks/{taskID}/storage-jobs/{jobID}/hold:
    post:
      parameters: [{$ref: '#/components/parameters/TaskID'}, {name: jobID, in: path, required: true, schema: {type: integer, format: int64}}]
      description: 'Task/attachment administrator may place a hold. Releasing also requires platform super-admin. Cannot change hold once deletion has been queued. Every change is audited.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [hold, reason], properties: {hold: {type: boolean}, reason: {type: string, minLength: 8, maxLength: 500}}}
      responses: {'200': {description: Hold updated}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /v1/auth/login:
    post:
      security: []
      description: Same-origin account login. HTTPS required outside loopback. Sets an HttpOnly SameSite=Strict cookie; 30 minute idle and 8 hour absolute expiry. All cookie-authenticated unsafe requests require X-Portal-Request=1.
      parameters: [{$ref: '#/components/parameters/PortalRequest'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [username,password], properties: {username: {type: string}, password: {type: string, format: password, maxLength: 72}}}}}}
      responses: {'200': {description: Account identity and expiry; session cookie set}, '401': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}
  /v1/auth/session/logout:
    post:
      security: [{portalSession: []}]
      parameters: [{$ref: '#/components/parameters/PortalRequest'}]
      responses: {'204': {description: Browser session revoked}, '403': {$ref: '#/components/responses/Error'}}
  /v1/portal/session:
    get:
      description: Current identity, direct tenant memberships, independent scoped platform grants, visible mandates and metadata. Hierarchy does not grant tenant content or payment access.
      responses: {'200': {description: Scoped portal identity}, '401': {$ref: '#/components/responses/Error'}}
  /v1/portal/users:
    post:
      description: Interactive account only; superadmin provisions an independent account, or tenant owner provisions a member. self=true creates the caller's first password login. Password is never returned.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [username,password,display_name], properties: {username: {type: string, pattern: '^[a-z0-9][a-z0-9._@-]{2,79}$'}, password: {type: string, format: password, description: 12 to 72 UTF-8 bytes}, display_name: {type: string}, tenant_id: {type: string}, role: {enum: [admin,billing,member,viewer]}, self: {type: boolean, default: false}}}}}}
      responses: {'201': {description: Account ID and login name}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /v1/portal/tenants:
    post:
      description: Create tenant with immutable parent and owner; maximum depth 8. Parent owner or scoped platform delegate required for children. No implicit content membership for a platform creator assigning another owner.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name,slug], properties: {name: {type: string}, slug: {type: string}, parent_id: {type: string}, owner_account_id: {type: string}, plan: {type: string}}}}}}
      responses: {'201': {description: Tenant created}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /v1/portal/grants:
    post:
      description: Interactive platform delegation; scope cannot exceed active parent grant. Only configured superadmins may originate a grant without a parent. No tenant content or merchant payout rights implied.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [account_id,tenant_id,role], properties: {account_id: {type: string}, tenant_id: {type: string, description: Tenant subtree ID or '*'}, role: {enum: [admin,operations,support,finance,auditor]}, parent_id: {type: string}}}}}}
      responses: {'201': {description: Grant created}, '403': {$ref: '#/components/responses/Error'}}
  /v1/portal/grants/{grantID}/revoke:
    post:
      parameters: [{name: grantID, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Grant and dependent grant chain ineffective}, '403': {$ref: '#/components/responses/Error'}}
  /v1/portal/tenants/{tenantID}/metadata:
    patch:
      parameters: [{$ref: '#/components/parameters/TenantID'}]
      description: Scoped platform admin or operations updates display name only; no hierarchy or billing history rewrite.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string}}}}}}
      responses: {'200': {description: Tenant metadata updated}, '403': {$ref: '#/components/responses/Error'}}
  /v1/portal/tenants/{tenantID}/finance-summary:
    get:
      parameters: [{$ref: '#/components/parameters/TenantID'}]
      description: Scoped platform finance or admin aggregate only; separate currency, environment and status. Does not return tenant checkout links.
      responses: {'200': {description: Bounded financial aggregate}, '403': {$ref: '#/components/responses/Error'}}
  /v1/portal/tenants/{tenantID}/billing:
    get:
      parameters: [{$ref: '#/components/parameters/TenantID'}]
      description: Direct tenant owner/admin/billing only. Includes tenant's service invoices and frozen liabilities explicitly accepted from children. Admin is read-only; only owner/billing may pay.
      responses: {'200': {description: Billing account, latest 200 invoices, tenant names, separated outstanding totals and can_pay}, '403': {$ref: '#/components/responses/Error'}}
  /v1/portal/tenants/{tenantID}/billing-account:
    post:
      parameters: [{$ref: '#/components/parameters/TenantID'}]
      description: Tenant owner creates canonical tenant billing account, or retrieves the existing account.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [currency], properties: {currency: {enum: [CNY,USD,EUR]}}}}}}
      responses: {'200': {description: Existing billing account}, '201': {description: Created billing account}, '403': {$ref: '#/components/responses/Error'}}
  /v1/portal/tenants/{tenantID}/quote:
    post:
      parameters: [{$ref: '#/components/parameters/TenantID'}]
      description: Tenant owner/billing previews all tenant members' usage; does not issue an invoice.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TenantInvoicePeriod'}}}}
      responses: {'200': {description: Usage quote}, '403': {$ref: '#/components/responses/Error'}}
  /v1/portal/tenants/{tenantID}/invoices:
    post:
      parameters: [{$ref: '#/components/parameters/TenantID'}, {name: Idempotency-Key, in: header, required: true, schema: {type: string}}]
      description: Tenant owner/billing issues one immutable invoice for all tenant usage. Overlapping periods rejected. Active mandate is rechecked at database commit; liability is then frozen.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TenantInvoicePeriod'}}}}
      responses: {'201': {description: Immutable tenant bill, content: {application/json: {schema: {$ref: '#/components/schemas/BillingDocument'}}}}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /v1/portal/mandates:
    post:
      description: Child tenant owner requests ancestor payment; pending until payer owner accepts. One pending or active mandate per service tenant.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [tenant_id,payer_tenant_id], properties: {tenant_id: {type: string}, payer_tenant_id: {type: string}}}}}}
      responses: {'201': {description: Pending payment mandate}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /v1/portal/mandates/{mandateID}/{action}:
    post:
      parameters: [{name: mandateID, in: path, required: true, schema: {type: string}}, {name: action, in: path, required: true, schema: {enum: [accept,revoke]}}]
      description: Payer owner accepts; either tenant owner may revoke future delegation. Existing invoices retain their frozen payer liability.
      responses: {'200': {description: Updated mandate}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /v1/treasury/receivables:
    get:
      description: Configured merchant operator only; latest 200 paid invoice candidates with checkout authority redacted. Not tenant content access.
      responses: {'200': {description: Read-only paid billing documents}, '403': {$ref: '#/components/responses/Error'}}
  /v1/treasury/receivables/{invoiceID}:
    get:
      parameters: [{name: invoiceID, in: path, required: true, schema: {type: string}}]
      description: Merchant-only financial evidence. can_pay=false; payment links and checkout fields redacted.
      responses: {'200': {description: Read-only original billing document}, '403': {$ref: '#/components/responses/Error'}}
  /v1/treasury/receivables/{invoiceID}/export:
    get:
      parameters: [{name: invoiceID, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Merchant-only invoice CSV including tenant liability and mandate, content: {text/csv: {schema: {type: string}}}}, '403': {$ref: '#/components/responses/Error'}}
  /v1/treasury/receivables/{invoiceID}/receipts/{receiptID}:
    get:
      parameters: [{name: invoiceID, in: path, required: true, schema: {type: string}}, {name: receiptID, in: path, required: true, schema: {type: string}}, {name: format, in: query, schema: {enum: [html,json]}}]
      responses: {'200': {description: Merchant-only receipt; HTML includes service tenant, liable tenant and initiating account}, '403': {$ref: '#/components/responses/Error'}}
  /v1/treasury:
    get:
      description: Operator-only treasury. Requires configured owner account and treasury:read. Demo balance is derived from verified demo receipts, never a customer wallet or live funds.
      responses: {'200': {description: Document, derived balances and supported routes}, '403': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/treasury/collections/import:
    post:
      description: treasury:write; configured merchant imports a single confirmed paid demo receipt once, including tenant or delegated group payments. Real receipts are rejected; no tenant payment authority is granted.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [invoice_id], properties: {invoice_id: {type: string}}}}}}
      responses: {'200': {description: Treasury document}, '422': {$ref: '#/components/responses/Error'}}
  /v1/treasury/collections/{collectionID}/settle-demo:
    post:
      parameters: [{name: collectionID, in: path, required: true, schema: {type: string}}]
      description: treasury:write; simulation-only settlement from pending to available net balance.
      responses: {'200': {description: Treasury document}}
  /v1/treasury/destinations:
    post:
      description: treasury:write; virtual destinations only. No raw bank numbers, wallet addresses or real ownership claims accepted.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [kind,label,currency], properties: {kind: {enum: [bank,alipay,paypal]}, label: {type: string, maxLength: 120}, currency: {enum: [CNY,USD,EUR]}}}}}}
      responses: {'200': {description: Treasury document with unverified virtual destination}}
  /v1/treasury/destinations/{destinationID}/verify-demo:
    post:
      parameters: [{name: destinationID, in: path, required: true, schema: {type: string}}]
      description: treasury:approve; simulates verification, never verifies a real bank account.
      responses: {'200': {description: Treasury document}}
  /v1/treasury/stripe/snapshot:
    get:
      parameters: [{name: currency, in: query, required: true, schema: {enum: [CNY,USD,EUR]}}]
      description: treasury:read; provider-authenticated own merchant balance and default bank. Requires manual payout schedule; sandbox/live configuration is separate from demo funds.
      responses: {'200': {description: Timestamped provider snapshot and masked destination}, '503': {$ref: '#/components/responses/Error'}}
  /v1/treasury/payouts:
    post:
      description: treasury:write; reserve available funds and freeze amount and destination. Operator-only, not marketplace disbursement. Live approval must use a different subject.
      parameters: [{name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 120}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [destination_id,amount_minor,currency,provider], properties: {destination_id: {type: string}, amount_minor: {type: integer, minimum: 1, maximum: 100000000}, currency: {enum: [CNY,USD,EUR]}, provider: {enum: [demo,stripe]}}}}}}
      responses: {'200': {description: Treasury document; repeated same key returns original request}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
  /v1/treasury/payouts/{payoutID}/decision:
    post:
      parameters: [{name: payoutID, in: path, required: true, schema: {type: string}}]
      description: treasury:approve; requested to approved/rejected/canceled, or approved to canceled. No cancellation after submission.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [decision], properties: {decision: {enum: [approve,reject,cancel]}}}}}}
      responses: {'200': {description: Treasury document}, '409': {$ref: '#/components/responses/Error'}}
  /v1/treasury/payouts/{payoutID}/submit:
    post:
      parameters: [{name: payoutID, in: path, required: true, schema: {type: string}}]
      description: treasury:approve; submit approved immutable request once. Unknown outcomes stay reserved and must be reconciled using original payout ID.
      responses: {'200': {description: Treasury document}, '409': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/treasury/payouts/{payoutID}/reconcile:
    post:
      parameters: [{name: payoutID, in: path, required: true, schema: {type: string}}]
      description: treasury:write; Stripe query or original-key retry within 23 hours when create outcome is unknown. Can record a later return without deleting prior receipts.
      responses: {'200': {description: Treasury document}}
  /v1/treasury/payouts/{payoutID}/simulate:
    post:
      parameters: [{name: payoutID, in: path, required: true, schema: {type: string}}]
      description: treasury:write; simulation only. Cannot affect sandbox or live payouts.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [outcome], properties: {outcome: {enum: [paid,failed,returned]}}}}}}
      responses: {'200': {description: Treasury document}}
  /v1/treasury/payouts/{payoutID}/receipt:
    get:
      parameters: [{name: payoutID, in: path, required: true, schema: {type: string}}]
      description: treasury:read; payout history record only, not a tax invoice or independent bank confirmation. Returned status is displayed on historical receipts.
      responses: {'200': {description: Printable payout record, content: {text/html: {schema: {type: string}}}}, '404': {$ref: '#/components/responses/Error'}}
  /v1/treasury/export:
    get:
      description: treasury:read; immutable collection and outgoing-payout amounts with environment, status and masked destination. CSV formula injection neutralized.
      responses: {'200': {description: Treasury CSV, content: {text/csv: {schema: {type: string}}}}}
  /v1/health/live:
    get: {security: [], responses: {'200': {description: Live}}}
  /v1/health/ready:
    get: {security: [], responses: {'200': {description: Ready}, '503': {$ref: '#/components/responses/Error'}}}
  /metrics:
    get: {security: [], responses: {'200': {description: Prometheus metrics, content: {text/plain: {schema: {type: string}}}}}}
  /v1/accounts:
    post:
      security: [{bootstrapToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string}}}}}}
      responses: {'201': {description: Account created, content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}}, '401': {$ref: '#/components/responses/Error'}}
  /v1/auth/token:
    post:
      security: [{bootstrapToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [account_id, subject], properties: {account_id: {type: string}, subject: {type: string}, ttl_seconds: {type: integer, minimum: 60, maximum: 3600}}}}}}
      responses: {'200': {description: Short-lived access token}, '401': {$ref: '#/components/responses/Error'}}
  /v1/auth/refresh:
    post: {security: [], responses: {'200': {description: Rotated access and refresh tokens}, '401': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /v1/auth/logout:
    post: {security: [], responses: {'204': {description: Refresh-token family revoked}}}
  /v1/auth/sso/exchange:
    post:
      security: []
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [id_token], properties: {id_token: {type: string}}}}}}
      responses: {'200': {description: OIDC identity exchanged for rotated platform credentials}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /v1/api-keys:
    get: {responses: {'200': {description: API keys without secret material}}}
    post: {responses: {'201': {description: API key and one-time secret}}}
  /v1/api-keys/{keyID}:
    delete: {parameters: [{name: keyID, in: path, required: true, schema: {type: string}}], responses: {'204': {description: API key revoked}}}
  /v1/audit/events:
    get: {responses: {'200': {description: Account audit trail}}}
  /v1/notifications:
    get: {responses: {'200': {description: Durable notifications}}}
  /v1/notifications/{notificationID}/read:
    post: {parameters: [{name: notificationID, in: path, required: true, schema: {type: string}}], responses: {'204': {description: Notification marked read}}}
  /v1/devices:
    get:
      parameters: [{name: include_revoked, in: query, schema: {type: boolean, default: false}}]
      responses: {'200': {description: Account devices}}
    post:
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name, public_key], properties: {device_id: {type: string}, name: {type: string}, public_key: {type: string}}}}}}
      responses: {'201': {description: Device registered}, '400': {$ref: '#/components/responses/Error'}}
  /v1/devices/{deviceID}:
    delete:
      parameters: [{$ref: '#/components/parameters/DeviceID'}]
      responses: {'204': {description: Revoked}, '404': {$ref: '#/components/responses/Error'}}
  /v1/agents:
    get: {responses: {'200': {description: Registered Agent profiles}}}
    post: {responses: {'201': {description: Agent profile created}}}
  /v1/agents/{agentID}:
    delete: {parameters: [{name: agentID, in: path, required: true, schema: {type: string}}], responses: {'204': {description: Agent revoked}}}
  /v1/tasks:
    get:
      description: Returns the light task index without event or Artifact payloads.
      responses: {'200': {description: Task index}}
    post:
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [title, objective], properties: {title: {type: string}, objective: {type: string}, origin_device: {type: string}, organization_id: {type: string}, team_id: {type: string}, metadata: {}}}}}}
      responses: {'201': {description: Task created, content: {application/json: {schema: {$ref: '#/components/schemas/Task'}}}}}
  /v1/tasks/{taskID}:
    get: {parameters: [{$ref: '#/components/parameters/TaskID'}], responses: {'200': {description: Task}, '403': {$ref: '#/components/responses/Error'}}}
  /v1/tasks/{taskID}/events:
    get:
      parameters: [{$ref: '#/components/parameters/TaskID'}, {name: after, in: query, schema: {type: integer}}, {name: include_payload, in: query, schema: {type: boolean, default: true}}]
      responses: {'200': {description: Cursor-ordered events}}
    post:
      parameters: [{$ref: '#/components/parameters/TaskID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: './schemas/task-state-v1.schema.json#/$defs/event'}}}}
      responses: {'201': {description: Event accepted}, '200': {description: Duplicate accepted idempotently}, '409': {$ref: '#/components/responses/Error'}}
  /v1/tasks/{taskID}/branches:
    get: {parameters: [{$ref: '#/components/parameters/TaskID'}], responses: {'200': {description: Task DAG branches}}}
    post: {parameters: [{$ref: '#/components/parameters/TaskID'}], responses: {'201': {description: Branch created}}}
  /v1/tasks/{taskID}/branches/{branchID}/events:
    get: {parameters: [{$ref: '#/components/parameters/TaskID'}, {$ref: '#/components/parameters/BranchID'}], responses: {'200': {description: Branch event history}}}
  /v1/tasks/{taskID}/branches/{branchID}/merge:
    post: {parameters: [{$ref: '#/components/parameters/TaskID'}, {$ref: '#/components/parameters/BranchID'}], responses: {'200': {description: Signed merge event accepted with provenance}, '409': {$ref: '#/components/responses/Error'}}}
  /v1/tasks/{taskID}/conflicts:
    get: {parameters: [{$ref: '#/components/parameters/TaskID'}], responses: {'200': {description: Open or resolved conflicts}}}
  /v1/tasks/{taskID}/conflicts/{conflictID}/resolve:
    post: {parameters: [{$ref: '#/components/parameters/TaskID'}, {name: conflictID, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Conflict explicitly resolved}}}
  /v1/tasks/{taskID}/branches/{branchID}/snapshots:
