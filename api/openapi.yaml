  /v1/marketplace/transactions/{transactionID}/complete:
    post: {parameters: [{$ref: '#/components/parameters/TransactionID'}], responses: {'200': {description: Seller completed transaction}, '409': {$ref: '#/components/responses/Error'}}}
  /v1/marketplace/transactions/{transactionID}/cancel:
    post: {parameters: [{$ref: '#/components/parameters/TransactionID'}], responses: {'200': {description: Pending transaction cancelled}, '409': {$ref: '#/components/responses/Error'}}}
  /v1/sync/hello:
    post: {responses: {'200': {description: Signed device capability negotiation}}}
  /v1/sync/push:
    post: {responses: {'200': {description: Per-event durable acknowledgements}}}
  /v1/sync/pull:
    post: {responses: {'200': {description: Cursor-ordered event batch and device keys}}}
  /v1/sync/ack:
    post: {responses: {'204': {description: Durable cursor acknowledged}}}
  /v1/reconcile:
    post: {responses: {'200': {description: Missing events, heads, conflicts, and reconciliation cursor}}}
  /v1/mcp:
    post: {description: MCP 2025-06-18 JSON-RPC endpoint, responses: {'200': {description: MCP response}}}
  /.well-known/agent-continuity.json:
    get: {security: [], responses: {'200': {description: Versioned project protocol profile and explicit compatibility boundaries}}}
  /v1/protocol/openapi.yaml:
    get: {security: [], responses: {'200': {description: This OpenAPI contract}}}
  /v1/protocol/schemas/{name}:
    get:
      security: []
      parameters: [{in: path, name: name, required: true, schema: {type: string}}]
      responses: {'200': {description: JSON Schema 2020-12 contract}, '404': {description: Unknown schema}}
  /v1/a2a:
    post: {description: Legacy custom JSON-RPC gateway with signed event parameters; not A2A 1.0 conformant, responses: {'200': {description: Legacy task or append result}}}
  /.well-known/agent-card.json:
    get: {security: [], responses: {'200': {description: A2A Agent Card}}}
