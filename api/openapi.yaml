    post: {description: Connect JSON unary AppendEvent procedure, responses: {'200': {description: Connect response}}}
  /agentcontinuity.v1.ContinuityService/GetContinuityPackage:
    post: {description: Connect JSON unary continuity package procedure, responses: {'200': {description: Connect response}}}
  /scim/v2/ServiceProviderConfig:
    get: {security: [{scimBearer: []}], responses: {'200': {description: SCIM 2.0 capabilities}}}
  /scim/v2/ResourceTypes:
    get: {security: [{scimBearer: []}], responses: {'200': {description: User and Group resource types}}}
