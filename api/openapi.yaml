    get:
      operationId: exportInvoiceCharges
      parameters: [{$ref: '#/components/parameters/InvoiceID'}]
      responses: {'200': {description: CSV consumption snapshot, content: {text/csv: {schema: {type: string}}}}}
  /v1/billing/invoices/{invoiceID}/void:
    post:
      operationId: voidInvoice
      parameters: [{$ref: '#/components/parameters/InvoiceID'}]
      responses: {'200': {description: Invoice voided only when no payment attempt exists}, '400': {$ref: '#/components/responses/Error'}}
  /v1/billing/invoices/{invoiceID}/payments:
    post:
      operationId: createPayment
      parameters: [{$ref: '#/components/parameters/InvoiceID'}, {$ref: '#/components/parameters/BillingIdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [provider], properties: {provider: {type: string, examples: [wechat, alipay, paypal, stripe, demo]}}}}}}
      responses: {'201': {description: Durable payment and limited capability link, content: {application/json: {schema: {type: object, properties: {payment: {$ref: '#/components/schemas/BillingPayment'}, payment_link: {type: string, format: uri}, invoice: {$ref: '#/components/schemas/BillingInvoice'}}}}}}, '409': {$ref: '#/components/responses/Error'}, '502': {$ref: '#/components/responses/Error'}}
  /v1/billing/invoices/{invoiceID}/payments/{paymentID}/reconcile:
    post:
      operationId: reconcilePayment
      parameters: [{$ref: '#/components/parameters/InvoiceID'}, {$ref: '#/components/parameters/PaymentID'}]
      responses: {'200': {description: Queried provider state; APPROVED PayPal orders are captured idempotently}, '502': {$ref: '#/components/responses/Error'}}
  /v1/billing/invoices/{invoiceID}/payments/{paymentID}/revoke-link:
    post:
      operationId: revokePaymentLink
      parameters: [{$ref: '#/components/parameters/InvoiceID'}, {$ref: '#/components/parameters/PaymentID'}]
      responses: {'200': {description: Link revoked; gateway order is not canceled}}
