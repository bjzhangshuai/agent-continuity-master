      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [listing_id, idempotency_key], properties: {listing_id: {type: string}, buyer_agent_id: {type: string}, seller_agent_id: {type: string}, task_id: {type: string}, quantity: {type: integer, minimum: 1, maximum: 1000}, idempotency_key: {type: string}}}}}}
      responses: {'201': {description: Pending Agent-to-Agent transaction created}, '409': {$ref: '#/components/responses/Error'}}
  /v1/marketplace/transactions/{transactionID}/authorize:
