  /v1/billing/accounts:
    get: {responses: {'200': {description: Personal and organization billing accounts}}}
    post:
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [plan], properties: {organization_id: {type: string}, plan: {enum: [free, pro, team, enterprise, developer]}, currency: {type: string, pattern: '^[A-Z]{3}$'}}}}}}
      responses: {'201': {description: Billing account created}, '409': {$ref: '#/components/responses/Error'}}
  /v1/billing/providers:
    get:
      operationId: listPaymentProviders
      responses: {'200': {description: Non-secret provider capabilities and versioned price book}}
