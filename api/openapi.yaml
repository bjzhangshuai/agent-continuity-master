    post: {security: [{scimBearer: []}], responses: {'201': {description: Group and Team created}}}
  /scim/v2/Groups/{groupID}:
    parameters: [{name: groupID, in: path, required: true, schema: {type: string}}]
    get: {security: [{scimBearer: []}], responses: {'200': {description: SCIM Group}}}
    put: {security: [{scimBearer: []}], responses: {'200': {description: SCIM Group replaced}}}
    patch: {security: [{scimBearer: []}], responses: {'200': {description: SCIM Group patched}}}
    delete: {security: [{scimBearer: []}], responses: {'204': {description: Empty Group and Team deleted}}}
components:
  securitySchemes:
    portalSession: {type: apiKey, in: cookie, name: ac_portal_session, description: Same-origin browser session. Unsafe requests also require X-Portal-Request=1.}
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
    bootstrapToken: {type: apiKey, in: header, name: X-Bootstrap-Token}
    oauthClient: {type: http, scheme: basic}
    scimBearer: {type: http, scheme: bearer, bearerFormat: opaque}
  parameters:
    PortalRequest: {name: X-Portal-Request, in: header, required: true, schema: {type: string, enum: ['1']}}
    TenantID: {name: tenantID, in: path, required: true, schema: {type: string}}
    InvoiceID: {name: invoiceID, in: path, required: true, schema: {type: string}}
    PaymentID: {name: paymentID, in: path, required: true, schema: {type: string}}
    BillingIdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}, description: Persist and reuse the same key on retry; never generate a new key for an uncertain payment.}
    TaskID: {name: taskID, in: path, required: true, schema: {type: string}}
    DeviceID: {name: deviceID, in: path, required: true, schema: {type: string}}
    ArtifactID: {name: artifactID, in: path, required: true, schema: {type: string}}
    OrganizationID: {name: organizationID, in: path, required: true, schema: {type: string}}
    BranchID: {name: branchID, in: path, required: true, schema: {type: string}}
    TransactionID: {name: transactionID, in: path, required: true, schema: {type: string}}
    AccountID: {name: accountID, in: path, required: true, schema: {type: string}}
  responses:
    Error: {description: Error envelope, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    TenantInvoicePeriod:
      type: object
      required: [period_start,period_end]
      properties:
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
    InvoiceRequest:
      type: object
      required: [billing_account_id, period_start, period_end]
      additionalProperties: false
      properties:
        billing_account_id: {type: string}
        period_start: {type: string, format: date-time, description: Inclusive}
        period_end: {type: string, format: date-time, description: Exclusive; a past interval of at most 366 days}
    BillingLine:
      type: object
      properties:
        metric: {type: string}
        description: {type: string}
        unit: {type: string}
        quantity: {type: integer, format: int64, minimum: 0}
        records: {type: integer, format: int64, minimum: 0}
        unit_size: {type: integer, format: int64, minimum: 1}
        unit_price_minor: {type: integer, format: int64, minimum: 0}
        amount_minor: {type: integer, format: int64, minimum: 0}
    BillingInvoice:
      type: object
      required: [invoice_id, account_id, currency, amount_minor, status, test_mode, lines]
      properties:
        invoice_id: {type: string}
        account_id: {type: string}
        billing_account_id: {type: string}
        organization_id: {type: string}
        payer_organization_id: {type: string, description: Frozen liable tenant; defaults to service tenant for independent billing}
        payment_mandate_id: {type: string}
        issued_by: {type: string, description: Actual issuing account}
        number: {type: string}
        status: {enum: [open, paid, void, refunded, disputed]}
        currency: {enum: [CNY, USD, EUR]}
        amount_minor: {type: integer, format: int64, minimum: 0, maximum: 100000000}
        test_mode: {type: boolean}
        price_book: {type: string}
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        due_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        lines: {type: array, items: {$ref: '#/components/schemas/BillingLine'}}
    BillingPayment:
      type: object
      properties:
        payment_id: {type: string}
        initiated_by: {type: string, description: Actual initiating account, independent of invoice owner key}
        provider: {type: string}
        environment: {enum: [simulation, sandbox, live]}
        status: {enum: [creating, pending, approved, succeeded, failed, canceled, expired, review]}
        amount_minor: {type: integer, format: int64}
        currency: {type: string}
        provider_order_id: {type: string}
        provider_transaction_id: {type: string}
        checkout_url: {type: string, format: uri}
        qr_code: {type: string}
        idempotency_key: {type: string}
        expires_at: {type: string, format: date-time}
        link_revoked: {type: boolean}
        last_error: {type: string}
    BillingDocument:
      type: object
      properties:
        invoice: {$ref: '#/components/schemas/BillingInvoice'}
        payments: {type: array, items: {$ref: '#/components/schemas/BillingPayment'}}
        receipts: {type: array, items: {type: object, description: Server-confirmed payment receipt; not a tax invoice}}
        refunds: {type: array, items: {type: object, properties: {refund_id: {type: string}, payment_id: {type: string}, amount_minor: {type: integer}, currency: {type: string}, status: {enum: [requested,approved,rejected,submitting,pending,succeeded,failed,review]}, requested_by: {type: string}, decided_by: {type: string}, provider_refund_id: {type: string}, reason: {type: string}, last_error: {type: string}}}}
        credit_notes: {type: array, items: {type: object, description: Immutable refund credit evidence, not tax invoice or bank confirmation}}
        events: {type: array, items: {type: object}}
        payment_links: {type: object, additionalProperties: {type: string, format: uri}}
        can_pay: {type: boolean, description: Effective current actor permission; false for read-only tenant admin and merchant evidence}
        version: {type: integer, format: int64}
    Account: {type: object, required: [account_id, name, created_at], properties: {account_id: {type: string}, name: {type: string}, created_at: {type: string, format: date-time}}}
    Task: {$ref: './schemas/task-state-v1.schema.json#/$defs/task'}
    Error: {type: object, properties: {error: {type: object, properties: {code: {type: string}, message: {type: string}}}}}
