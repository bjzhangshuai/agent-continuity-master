      operationId: quoteInvoice
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InvoiceRequest'}}}}
      responses: {'200': {description: Full-window consumption quote, content: {application/json: {schema: {$ref: '#/components/schemas/BillingInvoice'}}}}, '400': {$ref: '#/components/responses/Error'}}
  /v1/billing/invoices:
    get:
      operationId: listInvoices
      parameters: [{name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}]
      responses: {'200': {description: Account-scoped invoices, content: {application/json: {schema: {type: object, properties: {invoices: {type: array, items: {$ref: '#/components/schemas/BillingDocument'}}}}}}}}
    post:
      operationId: issueInvoice
      parameters: [{$ref: '#/components/parameters/BillingIdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InvoiceRequest'}}}}
      responses: {'201': {description: Immutable invoice snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/BillingDocument'}}}}, '409': {$ref: '#/components/responses/Error'}}
  /v1/billing/invoices/{invoiceID}:
    get:
      operationId: getInvoice
      parameters: [{$ref: '#/components/parameters/InvoiceID'}]
      responses: {'200': {description: Invoice with payments receipts audit events and active payment_links, content: {application/json: {schema: {$ref: '#/components/schemas/BillingDocument'}}}}, '404': {$ref: '#/components/responses/Error'}}
